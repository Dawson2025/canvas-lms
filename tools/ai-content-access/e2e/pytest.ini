[pytest]
# Course AI Assistant E2E suite — pytest config.
# Keep this dir self-contained: rootdir is the e2e/ folder so `config`/`helpers`
# import cleanly without installing a package.
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
markers =
    e2e: end-to-end browser test that requires a live Canvas at BASE_URL.
